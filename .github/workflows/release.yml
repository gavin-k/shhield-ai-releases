name: Release
run-name: Release v${{ inputs.version }} from ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Final package version without v'
        required: true
        type: string
      source_sha:
        description: 'Exact reviewed commit SHA in the source repository'
        required: true
        type: string
      windows_signing:
        description: 'unsigned: Windows goes to staging testers only and production ships without it'
        type: choice
        options: [signed, unsigned]
        default: signed

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      production_platforms: ${{ inputs.windows_signing == 'signed' && 'linux,macos,windows' || 'linux,macos' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate release identity
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node scripts/release-candidate.test.mjs
          node scripts/update-manifests.test.mjs
          node scripts/publish-staging.test.mjs
          node scripts/release-candidate.mjs preflight
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gavin-k/shhield-ai
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin source and check existing version tag
        id: source
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            test "$(git rev-parse "refs/tags/v$VERSION^{commit}")" = "$SOURCE_SHA"
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  staging-macos-arm64:
    needs: validate
    uses: ./.github/workflows/bundle-macos.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      target: aarch64-apple-darwin
      channel: staging
      signing: true
      package_desktop: true
      environment: signing
    secrets: inherit

  staging-macos-x64:
    needs: validate
    uses: ./.github/workflows/bundle-macos.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      target: x86_64-apple-darwin
      channel: staging
      signing: true
      package_desktop: true
      environment: signing
    secrets: inherit

  staging-windows:
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/bundle-windows.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      channel: staging
      signing: ${{ inputs.windows_signing == 'signed' }}
    secrets: inherit

  staging-candidate:
    needs: [validate, staging-macos-arm64, staging-macos-x64, staging-windows]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/prepare-candidate.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      channel: staging
      windows_signing: ${{ inputs.windows_signing }}
      artifact_ids: ${{ needs.staging-macos-arm64.outputs.package_artifact_id }},${{ needs.staging-macos-x64.outputs.package_artifact_id }},${{ needs.staging-windows.outputs.package_artifact_id }}
    secrets: inherit

  accept-staging:
    needs: [validate, staging-candidate]
    runs-on: ubuntu-latest
    environment:
      name: staging-acceptance
      url: ${{ needs.staging-candidate.outputs.artifact_url }}
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      CHANNEL: staging
      WINDOWS_SIGNING: ${{ inputs.windows_signing }}
      CANDIDATE_SHA256: ${{ needs.staging-candidate.outputs.sha256 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.staging-candidate.outputs.artifact_id }}
          path: candidate
      - name: Recheck approved candidate and staging service
        run: |
          node scripts/release-candidate.mjs verify candidate
          node scripts/verify-downloads.mjs candidate
          node scripts/release-candidate.mjs check-backend staging
          node scripts/release-candidate.mjs check-backend production

  production-macos-arm64:
    needs: [validate, accept-staging, staging-macos-arm64]
    uses: ./.github/workflows/bundle-macos.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      target: aarch64-apple-darwin
      channel: production
      signing: true
      package_desktop: true
      environment: signing
      backend_artifact_id: ${{ needs.staging-macos-arm64.outputs.backend_artifact_id }}
    secrets: inherit

  production-macos-x64:
    needs: [validate, accept-staging, staging-macos-x64]
    uses: ./.github/workflows/bundle-macos.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      target: x86_64-apple-darwin
      channel: production
      signing: true
      package_desktop: true
      environment: signing
      backend_artifact_id: ${{ needs.staging-macos-x64.outputs.backend_artifact_id }}
    secrets: inherit

  production-windows:
    needs: [validate, accept-staging, staging-windows]
    if: ${{ inputs.windows_signing == 'signed' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/bundle-windows.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      channel: production
      signing: true
      backend_artifact_id: ${{ needs.staging-windows.outputs.backend_artifact_id }}
    secrets: inherit

  linux:
    needs: [validate, accept-staging]
    uses: ./.github/workflows/build-cli-linux.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      package_desktop: true
    secrets: inherit

  production-candidate:
    needs: [validate, production-macos-arm64, production-macos-x64, production-windows, linux]
    # production-windows is skipped, not failed, when Windows stays in staging.
    if: ${{ !cancelled() && needs.production-macos-arm64.result == 'success' && needs.production-macos-x64.result == 'success' && needs.linux.result == 'success' && (needs.production-windows.result == 'success' || inputs.windows_signing == 'unsigned') }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/prepare-candidate.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      channel: production
      platforms: ${{ needs.validate.outputs.production_platforms }}
      artifact_ids: ${{ needs.production-macos-arm64.outputs.package_artifact_id }},${{ needs.production-macos-x64.outputs.package_artifact_id }},${{ inputs.windows_signing == 'signed' && format('{0},', needs.production-windows.outputs.package_artifact_id) || '' }}${{ needs.linux.outputs.package_artifact_ids }}
    secrets: inherit

  publish:
    needs: [validate, production-candidate]
    if: ${{ !cancelled() && needs.production-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ needs.production-candidate.outputs.artifact_url }}
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      CHANNEL: production
      RELEASE_PLATFORMS: ${{ needs.validate.outputs.production_platforms }}
      CANDIDATE_SHA256: ${{ needs.production-candidate.outputs.sha256 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.production-candidate.outputs.artifact_id }}
          path: candidate
      - name: Recheck approved candidate and production service
        run: |
          node scripts/release-candidate.mjs verify candidate
          node scripts/release-candidate.mjs check-backend production
      - name: Publish original files and switch latest
        run: |
          node scripts/publish-candidate.mjs candidate
          node scripts/verify-downloads.mjs candidate

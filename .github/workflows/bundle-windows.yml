name: "Bundle Desktop (Windows)"

on:
  workflow_call:
    outputs:
      backend_artifact_id:
        value: ${{ inputs.backend_artifact_id || jobs.package-windows.outputs.backend_artifact_id }}
      package_artifact_id:
        value: ${{ jobs.package-windows.outputs.package_artifact_id }}
    inputs:
      channel:
        required: true
        type: string
      backend_artifact_id:
        default: ''
        type: string
      version:
        description: 'Version to build'
        required: false
        type: string
      source_sha:
        description: 'Exact commit SHA in gavin-k/shhield-ai'
        required: true
        type: string
      signing:
        description: 'Whether to sign the Windows executables and MSI'
        required: false
        type: boolean
        default: false
      nsis:
        description: 'Also build the NSIS setup next to the MSI'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shhield-windows-release
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows x64 Desktop
    runs-on: windows-2022
    environment: ${{ inputs.signing && 'signing' || '' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_artifact_id: ${{ steps.backend.outputs.artifact-id }}
      package_artifact_id: ${{ steps.package.outputs.artifact-id }}
    env:
      SHHIELD_LICENSE_CHANNEL: ${{ inputs.channel }}
      APP_DIR: ${{ github.workspace }}/ui/desktop/${{ inputs.channel == 'staging' && 'out-staging/Shhield AI Staging-win32-x64' || 'out/Shhield AI-win32-x64' }}
      CARGO_HOME: ${{ github.workspace }}\cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
      PNPM_STORE_DIR: ${{ github.workspace }}\pnpm-store
      # Every pnpm call must use the store the install filled: the prePackage hook's
      # `pnpm licenses list` otherwise reads the default D:\.pnpm-store and fails.
      npm_config_store_dir: ${{ github.workspace }}\pnpm-store
    steps:
      - name: Validate signed channel
        shell: pwsh
        env:
          SIGNING: ${{ inputs.signing }}
        run: |
          if ($env:SHHIELD_LICENSE_CHANNEL -notin @('staging', 'production')) { throw 'Invalid channel' }
          # Unsigned MSIs only reach staging testers while the Windows certificate is pending.
          if ($env:SIGNING -ne 'true' -and $env:SHHIELD_LICENSE_CHANNEL -ne 'staging') { throw 'Production packages must be signed' }
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gavin-k/shhield-ai
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install project toolchains
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          toolchain: 1.96.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061  # v4.2.0
        with:
          version: 10.34.5

      - name: Verify hosted toolchain
        shell: pwsh
        run: |
          foreach ($command in @('git', 'cargo', 'rustc', 'rustup', 'node', 'pnpm')) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required runner tool is missing: $command"
            }
          }
          if ((node --version).Trim() -ne 'v24.10.0') { throw 'Expected Node v24.10.0' }
          if ((pnpm --version).Trim() -ne '10.34.5') { throw 'Expected pnpm 10.34.5' }
          rustup show active-toolchain

          $candlePath = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          if (-not $candlePath) {
            $candlePath = (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3.*\bin\candle.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $candlePath) { throw 'WiX Toolset v3 was not found' }
          foreach ($tool in @('light.exe', 'torch.exe')) {
            if (-not (Test-Path (Join-Path (Split-Path $candlePath) $tool))) {
              throw "WiX $tool was not found next to candle.exe"
            }
          }
          (Split-Path $candlePath) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME, $env:CARGO_TARGET_DIR, $env:PNPM_STORE_DIR | Out-Null

      - name: Pin NSIS compiler
        if: ${{ inputs.nsis }}
        shell: pwsh
        run: ./ui/desktop/installer/nsis/ensure-makensis.ps1

      - name: Apply release version
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash scripts/set-cargo-version.sh "${VERSION#v}"
          # Cargo.lock records the workspace member versions. The production job reuses
          # the staging backend and never runs cargo build, so sync the lock here or the
          # third-party notices step fails on `cargo metadata --locked`.
          cargo update --workspace
          cd ui/desktop
          npm pkg set "version=${VERSION#v}"

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (Get-Content ui/desktop/package.json | ConvertFrom-Json).version
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build privacy-profile backend
        if: inputs.backend_artifact_id == ''
        shell: pwsh
        run: |
          # The feature set lives in crates/shhield-cli/Cargo.toml (windows-desktop)
          # so that features upstream adds to the default build reach Windows too.
          cargo build --release -p shhield-cli --bin shhield `
            --no-default-features `
            --features windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Rust backend build failed' }

          $binDir = 'ui/desktop/src/bin'
          Remove-Item $binDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/release/shhield.exe" "$binDir/shhield.exe" -Force

      - name: Preserve unsigned backend for the production package
        if: inputs.backend_artifact_id == ''
        id: backend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: internal-shhield-windows-${{ github.run_attempt }}
          path: target/release/shhield.exe
          retention-days: 30
          if-no-files-found: error
      - name: Reuse the tested source backend
        if: inputs.backend_artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.backend_artifact_id }}
          path: ui/desktop/src/bin

      - name: Package Electron application
        shell: pwsh
        env:
          ELECTRON_PLATFORM: win32
        run: |
          Set-Location ui/desktop
          pnpm install --frozen-lockfile --store-dir "$env:PNPM_STORE_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'pnpm install failed' }
          node scripts/prepare-platform-binaries.js
          if ($LASTEXITCODE -ne 0) { throw 'Preparing platform binaries failed' }
          pnpm run package --platform=win32 --arch=x64
          if ($LASTEXITCODE -ne 0) { throw 'Desktop packaging failed' }

      - name: Verify packaged PE architecture
        shell: pwsh
        run: |
          foreach ($file in @(
            "$env:APP_DIR/Shhield.exe",
            "$env:APP_DIR/resources/bin/shhield.exe"
          )) {
            $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($file))
            try {
              $reader.BaseStream.Seek(0x3c, [IO.SeekOrigin]::Begin) | Out-Null
              $peOffset = $reader.ReadInt32()
              $reader.BaseStream.Seek($peOffset + 4, [IO.SeekOrigin]::Begin) | Out-Null
              $machine = $reader.ReadUInt16()
              if ($machine -ne 0x8664) {
                throw "Expected x64 PE (0x8664), got 0x$($machine.ToString('x4')): $file"
              }
            } finally {
              $reader.Dispose()
            }
          }

      - name: Azure login
        if: ${{ inputs.signing }}
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executables
        if: ${{ inputs.signing }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ env.APP_DIR }}/Shhield.exe
            ${{ env.APP_DIR }}/resources/bin/shhield.exe

      - name: Prepare WiX MSI
        id: prepare-msi
        shell: pwsh
        env:
          SIGNING: ${{ inputs.signing }}
        run: |
          $arguments = @(
            'scripts/windows-distribution.mjs', 'prepare-msi',
            '--app-dir', "$env:APP_DIR",
            '--output-dir', "$env:GITHUB_WORKSPACE/windows-artifacts",
            '--version', '${{ steps.version.outputs.value }}',
            '--variant', 'standard'
          )
          if ($env:SIGNING -ne 'true') { $arguments += @('--unsigned', 'true') }
          Set-Location ui/desktop
          & node @arguments
          if ($LASTEXITCODE -ne 0) { throw 'MSI preparation failed' }

      - name: Sign WiX support executable
        if: ${{ inputs.signing }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ steps.prepare-msi.outputs.support_binaries }}

      - name: Compile WiX MSI
        id: compile-msi
        shell: pwsh
        run: |
          Set-Location ui/desktop
          node scripts/windows-distribution.mjs compile-msi `
            --manifest '${{ steps.prepare-msi.outputs.manifest }}'
          if ($LASTEXITCODE -ne 0) { throw 'MSI compilation failed' }

      - name: Sign MSI
        if: ${{ inputs.signing }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ steps.compile-msi.outputs.msi_file }}

      - name: Checksum MSI
        shell: pwsh
        run: |
          $file = Get-Item '${{ steps.compile-msi.outputs.msi_file }}'
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($file.FullName).sha256", "$hash  $($file.Name)`n", [Text.Encoding]::ASCII)

      - name: Verify signatures
        if: ${{ inputs.signing }}
        shell: pwsh
        run: |
          $manifest = Get-Content '${{ steps.prepare-msi.outputs.manifest }}' | ConvertFrom-Json
          $files = @(
            "$env:APP_DIR/Shhield.exe",
            "$env:APP_DIR/resources/bin/shhield.exe",
            '${{ steps.compile-msi.outputs.msi_file }}'
          ) + @($manifest.supportBinaries)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "Signature invalid for ${file}: $($signature.Status)" }
          }

      - name: Resolve previous production MSI
        if: inputs.channel == 'production'
        id: baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/gavin-k/shhield-ai-releases/releases/latest' -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'
            }
          } catch {
            if ($_.Exception.Response.StatusCode -eq 404) {
              'No prior production release: use synthetic installer baseline' | Write-Host
              exit 0
            }
            throw
          }
          $asset = @($release.assets | Where-Object { $_.name -match '^Shhield-AI-[0-9]+\.[0-9]+\.[0-9]+-windows-x64\.msi$' })
          # Releases may skip Windows until its certificate lands; once shipped, publish refuses to drop it.
          if ($asset.Count -eq 0) {
            "$($release.tag_name) has no Windows MSI: use synthetic installer baseline" | Write-Host
            exit 0
          }
          if ($asset.Count -ne 1) { throw 'Previous release must contain exactly one Windows MSI' }
          $baselineDir = Join-Path $env:RUNNER_TEMP 'previous-release'
          gh release download $release.tag_name --repo gavin-k/shhield-ai-releases --pattern $asset[0].name --dir $baselineDir
          if ($LASTEXITCODE -ne 0) { throw 'Previous MSI download failed' }
          $baselinePath = Join-Path $baselineDir $asset[0].name
          if ((Get-AuthenticodeSignature $baselinePath).Status -ne 'Valid') { throw 'Previous MSI signature invalid' }
          "path=$baselinePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Smoke MSI lifecycle
        timeout-minutes: 15
        shell: pwsh
        run: |
          ./scripts/verify-windows-distribution.ps1 `
            -MsiPath '${{ steps.compile-msi.outputs.msi_file }}' `
            -AppDirectory "$env:APP_DIR" `
            -Version '${{ steps.version.outputs.value }}' `
            -Channel '${{ inputs.channel }}' `
            -BaselineMsiPath '${{ steps.baseline.outputs.path }}'

      # The NSIS setup is built after the MSI proves itself so a broken setup never blocks the MSI
      # evidence. It wraps the same signed APP_DIR; only the shipped, hook-free package is uploaded.
      - name: Build NSIS setup UI
        if: ${{ inputs.nsis }}
        shell: pwsh
        run: ./ui/desktop/installer/nsis/build-native.ps1 -Kind plugin -OutDir "$env:RUNNER_TEMP\nsis-native"

      - name: Build NSIS setup
        if: ${{ inputs.nsis }}
        id: nsis
        shell: pwsh
        env:
          SIGNING: ${{ inputs.signing }}
          NSIS_CHANNEL: ${{ inputs.channel == 'staging' && 'staging' || 'stable' }}
        run: |
          $arguments = @(
            'ui/desktop/scripts/windows-nsis.mjs', 'build-nsis',
            '--app-dir', "$env:APP_DIR",
            '--output-dir', "$env:GITHUB_WORKSPACE/windows-artifacts",
            '--version', '${{ steps.version.outputs.value }}',
            '--channel', "$env:NSIS_CHANNEL",
            '--plugin-dir', "$env:RUNNER_TEMP\nsis-native"
          )
          if ($env:SIGNING -ne 'true') { $arguments += @('--unsigned', 'true') }
          & node @arguments
          if ($LASTEXITCODE -ne 0) { throw 'NSIS setup build failed' }

      - name: Build NSIS upgrade package with test hooks
        if: ${{ inputs.nsis }}
        id: nsis-hook
        shell: pwsh
        env:
          NSIS_CHANNEL: ${{ inputs.channel == 'staging' && 'staging' || 'stable' }}
        run: |
          # Fault injection and the upgrade path need a newer package. It carries test hooks, stays
          # unsigned, and lives outside windows-artifacts so it can never be uploaded or released.
          $parts = '${{ steps.version.outputs.value }}'.Split('.')
          $parts[2] = [string]([int]$parts[2] + 1)
          $upgrade = $parts -join '.'
          node ui/desktop/scripts/windows-nsis.mjs build-nsis --app-dir "$env:APP_DIR" --output-dir "$env:RUNNER_TEMP\nsis-hook" `
            --version $upgrade --channel "$env:NSIS_CHANNEL" --plugin-dir "$env:RUNNER_TEMP\nsis-native" --unsigned true --test-hooks true
          if ($LASTEXITCODE -ne 0) { throw 'NSIS upgrade package build failed' }
          "version=$upgrade" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Sign NSIS setup
        if: ${{ inputs.signing && inputs.nsis }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ steps.nsis.outputs.package }}

      - name: Checksum NSIS setup
        if: ${{ inputs.nsis }}
        shell: pwsh
        run: |
          # Signing changes the bytes, so the sidecar written by the build is replaced here.
          $file = Get-Item '${{ steps.nsis.outputs.package }}'
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($file.FullName).sha256", "$hash  $($file.Name)`n", [Text.Encoding]::ASCII)

      - name: Verify NSIS setup signature
        if: ${{ inputs.signing && inputs.nsis }}
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature '${{ steps.nsis.outputs.package }}'
          if ($signature.Status -ne 'Valid') { throw "Signature invalid for the NSIS setup: $($signature.Status)" }

      - name: Smoke NSIS lifecycle
        if: ${{ inputs.nsis }}
        timeout-minutes: 60
        shell: pwsh
        env:
          SIGNING: ${{ inputs.signing }}
          NSIS_CHANNEL: ${{ inputs.channel == 'staging' && 'staging' || 'stable' }}
        run: |
          ./scripts/verify-windows-nsis.ps1 `
            -SetupPath '${{ steps.nsis.outputs.package }}' `
            -UpgradeSetupPath '${{ steps.nsis-hook.outputs.package }}' `
            -Version '${{ steps.version.outputs.value }}' `
            -UpgradeVersion '${{ steps.nsis-hook.outputs.version }}' `
            -Channel "$env:NSIS_CHANNEL" `
            -BaselineMsiPath '${{ steps.baseline.outputs.path }}' `
            -RequireSignedUninstaller:($env:SIGNING -eq 'true') `
            -ReportDirectory "$env:RUNNER_TEMP\nsis-report"

      - name: Upload NSIS smoke report
        if: ${{ always() && inputs.nsis }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 30
          name: Shhield-${{ inputs.channel }}-windows-nsis-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nsis-report
          if-no-files-found: warn

      - name: Upload Windows build
        id: package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 30
          name: Shhield-${{ inputs.channel }}-windows-x64-${{ github.run_attempt }}
          path: |
            windows-artifacts/*.msi
            windows-artifacts/*.exe
            windows-artifacts/*.sha256
          if-no-files-found: error


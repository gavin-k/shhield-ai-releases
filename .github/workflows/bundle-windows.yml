name: "Bundle Desktop (Windows)"

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: false
        type: string
      source_sha:
        description: 'Exact commit SHA in gavin-k/shhield-ai'
        required: true
        type: string
      signing:
        description: 'Whether to sign the Windows executables and MSI'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shhield-windows-release
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows x64 Desktop
    runs-on: windows-2022
    environment: ${{ inputs.signing && 'signing' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_HOME: ${{ github.workspace }}\cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
      PNPM_STORE_DIR: ${{ github.workspace }}\pnpm-store
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gavin-k/shhield-ai
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install project toolchains
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          toolchain: 1.96.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061  # v4.2.0
        with:
          version: 10.34.5

      - name: Verify hosted toolchain
        shell: pwsh
        run: |
          foreach ($command in @('git', 'cargo', 'rustc', 'rustup', 'node', 'pnpm')) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required runner tool is missing: $command"
            }
          }
          if ((node --version).Trim() -ne 'v24.10.0') { throw 'Expected Node v24.10.0' }
          if ((pnpm --version).Trim() -ne '10.34.5') { throw 'Expected pnpm 10.34.5' }
          rustup show active-toolchain

          $candlePath = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          if (-not $candlePath) {
            $candlePath = (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3.*\bin\candle.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $candlePath) { throw 'WiX Toolset v3 was not found' }
          if (-not (Test-Path (Join-Path (Split-Path $candlePath) 'light.exe'))) {
            throw 'WiX light.exe was not found next to candle.exe'
          }
          (Split-Path $candlePath) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME, $env:CARGO_TARGET_DIR, $env:PNPM_STORE_DIR | Out-Null

      - name: Apply release version
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash scripts/set-cargo-version.sh "${VERSION#v}"
          cd ui/desktop
          npm pkg set "version=${VERSION#v}"

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (Get-Content ui/desktop/package.json | ConvertFrom-Json).version
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build privacy-profile backend
        shell: pwsh
        run: |
          cargo build --release -p shhield-cli --bin shhield `
            --no-default-features `
            --features code-mode,local-inference,rustls-tls,system-keyring
          if ($LASTEXITCODE -ne 0) { throw 'Rust backend build failed' }

          $binDir = 'ui/desktop/src/bin'
          Remove-Item $binDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/release/shhield.exe" "$binDir/shhield.exe" -Force

      - name: Prepare bundled rbt3 input
        shell: pwsh
        env:
          SHHIELD_RBT3_BUILD_BASE_URL: ${{ vars.SHHIELD_RBT3_BUILD_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SHHIELD_RBT3_BUILD_BASE_URL)) {
            throw 'Set SHHIELD_RBT3_BUILD_BASE_URL to the controlled rbt3 object directory.'
          }
          $modelDir = Join-Path $env:RUNNER_TEMP 'shhield-rbt3'
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          foreach ($file in @('config.json', 'tokenizer.json', 'model.safetensors')) {
            $baseUrl = $env:SHHIELD_RBT3_BUILD_BASE_URL.TrimEnd('/')
            Invoke-WebRequest -Uri "$baseUrl/$file" -OutFile (Join-Path $modelDir $file)
          }
          "SHHIELD_RBT3_MODEL_DIR=$modelDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Electron application
        shell: pwsh
        env:
          ELECTRON_PLATFORM: win32
        run: |
          Set-Location ui/desktop
          pnpm install --frozen-lockfile --store-dir "$env:PNPM_STORE_DIR"
          node scripts/prepare-platform-binaries.js
          pnpm run stage-privacy-model
          pnpm run i18n:compile
          pnpm exec electron-forge package --platform=win32 --arch=x64

      - name: Verify packaged PE architecture
        shell: pwsh
        run: |
          foreach ($file in @(
            'ui/desktop/out/Shhield AI-win32-x64/Shhield.exe',
            'ui/desktop/out/Shhield AI-win32-x64/resources/bin/shhield.exe'
          )) {
            $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($file))
            try {
              $reader.BaseStream.Seek(0x3c, [IO.SeekOrigin]::Begin) | Out-Null
              $peOffset = $reader.ReadInt32()
              $reader.BaseStream.Seek($peOffset + 4, [IO.SeekOrigin]::Begin) | Out-Null
              $machine = $reader.ReadUInt16()
              if ($machine -ne 0x8664) {
                throw "Expected x64 PE (0x8664), got 0x$($machine.ToString('x4')): $file"
              }
            } finally {
              $reader.Dispose()
            }
          }

      - name: Azure login
        if: ${{ inputs.signing }}
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executables
        if: ${{ inputs.signing }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}/ui/desktop/out/Shhield AI-win32-x64/Shhield.exe
            ${{ github.workspace }}/ui/desktop/out/Shhield AI-win32-x64/resources/bin/shhield.exe

      - name: Prepare WiX MSI
        id: prepare-msi
        shell: pwsh
        env:
          SIGNING: ${{ inputs.signing }}
        run: |
          $arguments = @(
            'scripts/windows-distribution.mjs', 'prepare-msi',
            '--app-dir', "$env:GITHUB_WORKSPACE/ui/desktop/out/Shhield AI-win32-x64",
            '--output-dir', "$env:GITHUB_WORKSPACE/windows-artifacts",
            '--version', '${{ steps.version.outputs.value }}',
            '--variant', 'standard'
          )
          if ($env:SIGNING -ne 'true') { $arguments += @('--unsigned', 'true') }
          Set-Location ui/desktop
          & node @arguments
          if ($LASTEXITCODE -ne 0) { throw 'MSI preparation failed' }

      - name: Sign WiX support executable
        if: ${{ inputs.signing }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ steps.prepare-msi.outputs.support_binaries }}

      - name: Compile WiX MSI
        id: compile-msi
        shell: pwsh
        run: |
          Set-Location ui/desktop
          node scripts/windows-distribution.mjs compile-msi `
            --manifest '${{ steps.prepare-msi.outputs.manifest }}'
          if ($LASTEXITCODE -ne 0) { throw 'MSI compilation failed' }

      - name: Sign MSI
        if: ${{ inputs.signing }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ steps.compile-msi.outputs.msi_file }}

      - name: Checksum MSI
        shell: pwsh
        run: |
          $file = Get-Item '${{ steps.compile-msi.outputs.msi_file }}'
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii "$($file.FullName).sha256"

      - name: Verify signatures
        if: ${{ inputs.signing }}
        shell: pwsh
        run: |
          $manifest = Get-Content '${{ steps.prepare-msi.outputs.manifest }}' | ConvertFrom-Json
          $files = @(
            'ui/desktop/out/Shhield AI-win32-x64/Shhield.exe',
            'ui/desktop/out/Shhield AI-win32-x64/resources/bin/shhield.exe',
            '${{ steps.compile-msi.outputs.msi_file }}'
          ) + @($manifest.supportBinaries)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "Signature invalid for ${file}: $($signature.Status)" }
          }

      - name: Smoke MSI lifecycle
        shell: pwsh
        run: |
          ./scripts/verify-windows-distribution.ps1 `
            -MsiPath '${{ steps.compile-msi.outputs.msi_file }}' `
            -AppDirectory "$env:GITHUB_WORKSPACE/ui/desktop/out/Shhield AI-win32-x64" `
            -Version '${{ steps.version.outputs.value }}'

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 1
          name: Shhield-AI-${{ steps.version.outputs.value }}-windows-x64${{ !inputs.signing && '-unsigned' || '' }}
          path: |
            windows-artifacts/*.msi
            windows-artifacts/*.sha256
          if-no-files-found: error
          overwrite: true

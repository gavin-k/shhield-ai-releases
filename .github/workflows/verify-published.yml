name: Verify published release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Original release run ID
        required: true
        type: string
      candidate_artifact_id:
        description: Frozen production candidate artifact ID
        required: true
        type: string
      candidate_sha256:
        description: Approved candidate.json SHA-256
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_run_id }}
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: candidate
      - name: Verify original candidate provenance
        run: |
          gh attestation verify candidate/candidate.json --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/prepare-candidate.yml" \
            --deny-self-hosted-runners
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { verifyCandidate, sha256 } from './scripts/release-candidate.mjs';
          await verifyCandidate('candidate', { channel: 'production', run_id: process.env.RELEASE_RUN_ID });
          assert.equal(await sha256('candidate/candidate.json'), process.env.CANDIDATE_SHA256);
          NODE
      - name: Verify published bytes and website manifest
        run: |
          node scripts/verify-downloads.mjs candidate
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import { websiteManifest } from './scripts/release-candidate.mjs';
          const candidate = JSON.parse(await fs.readFile('candidate/candidate.json', 'utf8'));
          const response = await fetch('https://download.shhield.ai/stable/latest.json', { signal: AbortSignal.timeout(30000) });
          assert.equal(response.status, 200);
          const manifest = await response.json();
          assert.ok(typeof manifest.published_at === 'string' && Number.isFinite(Date.parse(manifest.published_at)));
          assert.deepEqual(manifest, websiteManifest(candidate, manifest.published_at));
          console.log('Verified published website manifest for ' + candidate.version);
          NODE

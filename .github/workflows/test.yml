name: Test release scripts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Release script tests
        run: |
          ruby scripts/validate-macos-workflow.test.rb
          ruby scripts/validate-windows-workflow.test.rb
          node scripts/release-candidate.test.mjs
          node scripts/update-manifests.test.mjs
          node scripts/publish-staging.test.mjs

on:
  workflow_call:
    inputs:
      version:
        required: false
        default: ""
        type: string
      source_sha:
        description: 'Exact commit SHA in gavin-k/shhield-ai'
        required: true
        type: string
      package_desktop:
        description: 'Also package Linux desktop artifacts; CLI artifacts are always included'
        required: false
        default: false
        type: boolean

name: "Build CLI and optionally Desktop for Linux"

permissions:
  contents: read

jobs:
  build-cli-linux:
    name: Build Shhield (Linux, ${{ matrix.architecture }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.build-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            target-suffix: unknown-linux-gnu
            build-on: ubuntu-22.04
            # Pinned by digest for reproducible builds; bump explicitly when newer manylinux_2_28 images ship.
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:441c35fdc6ee809ff9260894f8468ab4fea8c15dc880f8700a3f81b7922c1cda
            variant: standard

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gavin-k/shhield-ai
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Update version in Cargo.toml
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/set-cargo-version.sh "$VERSION"

      - name: Install Linux build dependencies (host runner)
        if: matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libxcb1-dev

          if [ "${{ matrix.variant }}" = "vulkan" ]; then
            sudo apt-get install -y \
              libvulkan-dev \
              libvulkan1 \
              glslc
          fi

          if [ "${{ matrix.variant }}" = "musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Install Linux build dependencies (manylinux container)
        if: matrix.container != ''
        run: |
          # perl-core provides FindBin, File::Compare, etc. that openssl-sys's
          # vendored openssl build needs; in AlmaLinux 8 these aren't standalone packages.
          # clang provides libclang.so for bindgen (used by llama-cpp-sys-2).
          # Defensive: avoid actions/checkout falling back to a tarball download if base image changes.
          dnf install -y --setopt=install_weak_deps=False \
            openssl-devel \
            dbus-devel \
            libxcb-devel \
            cmake \
            perl-core \
            clang \
            git \
            tar

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.architecture }}-${{ matrix.target-suffix }}-${{ matrix.build-on }}-${{ matrix.container || 'native' }}

      - name: Build CLI (host runner)
        if: matrix.container == ''
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: 1
        run: |
          source ./bin/activate-hermit
          export TARGET="${{ matrix.architecture }}-${{ matrix.target-suffix }}"
          rustup target add "${TARGET}"
          echo "Building for target: ${TARGET}"
          echo "Rust toolchain info:"
          rustup show

          FEATURE_ARGS=()
          if [ "${{ matrix.variant }}" = "vulkan" ]; then
            FEATURE_ARGS=(--features vulkan)
          fi

          if [ "${{ matrix.variant }}" = "musl" ]; then
            cargo build --release --target ${TARGET} -p shhield-cli --bin shhield \
              --no-default-features \
              --features portable-default
          else
            cargo build --release --target ${TARGET} -p shhield-cli --bin shhield "${FEATURE_ARGS[@]}"
          fi

      - name: Build CLI (manylinux container)
        if: matrix.container != ''
        env:
          RUST_BACKTRACE: 1
        run: |
          # Hermit's tool cache is host-runner-scoped; inside the container we
          # bootstrap rustup directly and let rust-toolchain.toml pin the channel.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          export PATH="$HOME/.cargo/bin:$PATH"
          TARGET="${{ matrix.architecture }}-${{ matrix.target-suffix }}"
          RUST_CHANNEL=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          if [ -z "$RUST_CHANNEL" ]; then
            echo "Could not parse channel from rust-toolchain.toml" >&2
            exit 1
          fi
          rustup toolchain install "$RUST_CHANNEL" --profile minimal \
            --component rustc,cargo --target "$TARGET"
          rustup show
          cargo build --release --target "$TARGET" -p shhield-cli --bin shhield

      - name: Package CLI
        if: ${{ !inputs.package_desktop }}
        run: |
          # Hermit isn't installed in the manylinux container; tar is all this step needs.
          if [ "${{ matrix.container }}" = '' ]; then
            source ./bin/activate-hermit
          fi
          export TARGET="${{ matrix.architecture }}-${{ matrix.target-suffix }}"
          export VARIANT_SUFFIX=""
          if [ "${{ matrix.variant }}" = "vulkan" ]; then
            VARIANT_SUFFIX="-vulkan"
          fi

          # Create a directory for the package contents
          mkdir -p "target/${TARGET}/release/shhield-package"

          # Copy the shhield binary
          cp "target/${TARGET}/release/shhield" "target/${TARGET}/release/shhield-package/"

          cd "target/${TARGET}/release"
          tar -cjf "shhield-${TARGET}${VARIANT_SUFFIX}.tar.bz2" -C shhield-package .
          tar -czf "shhield-${TARGET}${VARIANT_SUFFIX}.tar.gz" -C shhield-package .
          echo "ARTIFACT_BZ2=target/${TARGET}/release/shhield-${TARGET}${VARIANT_SUFFIX}.tar.bz2" >> "$GITHUB_ENV"
          echo "ARTIFACT_GZ=target/${TARGET}/release/shhield-${TARGET}${VARIANT_SUFFIX}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload CLI artifact
        if: ${{ !inputs.package_desktop }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 1
          name: shhield-${{ matrix.architecture }}-${{ matrix.target-suffix }}${{ matrix.variant != 'standard' && matrix.variant != 'musl' && format('-{0}', matrix.variant) || '' }}
          path: |
            ${{ env.ARTIFACT_BZ2 }}
            ${{ env.ARTIFACT_GZ }}

      - name: Prepare internal Shhield binary
        if: ${{ inputs.package_desktop && matrix.target-suffix == 'unknown-linux-gnu' }}
        env:
          TARGET: ${{ matrix.architecture }}-${{ matrix.target-suffix }}
          VARIANT_SUFFIX: ${{ matrix.variant == 'vulkan' && '-vulkan' || '' }}
        run: |
          mkdir -p artifacts
          cp "target/${TARGET}/release/shhield" "artifacts/internal-shhield-${TARGET}${VARIANT_SUFFIX}"

      - name: Upload internal Shhield binary
        if: ${{ inputs.package_desktop && matrix.target-suffix == 'unknown-linux-gnu' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 1
          name: internal-shhield-${{ matrix.architecture }}-${{ matrix.target-suffix }}${{ matrix.variant == 'vulkan' && '-vulkan' || '' }}
          path: artifacts/internal-shhield-${{ matrix.architecture }}-${{ matrix.target-suffix }}${{ matrix.variant == 'vulkan' && '-vulkan' || '' }}
          if-no-files-found: error
          overwrite: true

  package-desktop-linux:
    name: Package Desktop (Linux, ${{ matrix.electron_arch }}, ${{ matrix.variant }})
    if: ${{ inputs.package_desktop }}
    needs: build-cli-linux
    runs-on: ${{ matrix.build_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            electron_arch: x64
            flatpak_arch: x86_64
            variant: standard
            variant_suffix: ''
            build_on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gavin-k/shhield-ai
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Update desktop version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          source ./bin/activate-hermit
          cd ui/desktop
          npm pkg set "version=${VERSION}"

      - name: Debug workflow info
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "=== Workflow Information ==="
          echo "Workflow: ${WORKFLOW_NAME}"
          echo "Ref: ${WORKFLOW_REF}"
          echo "Event: ${EVENT_NAME}"
          echo "Repo: ${REPOSITORY}"
          echo "Target: ${TARGET}"
          echo "Variant: ${VARIANT}"
          echo ""
          echo "=== System Information ==="
          uname -a
          lsb_release -a || true
          df -h

      - name: Install system dependencies
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxss1 \
            rpm \
            fakeroot \
            dpkg-dev \
            protobuf-compiler \
            flatpak \
            flatpak-builder \
            elfutils

          if [ "${VARIANT}" = "vulkan" ]; then
            sudo apt-get install -y \
              libasound2t64 \
              libvulkan-dev \
              libvulkan1 \
              glslc
          else
            sudo apt-get install -y libasound2
          fi

      - name: Configure RPM packaging
        run: |
          echo '%_build_id_links none' > ~/.rpmmacros
          test "$(rpm --eval '%{_build_id_links}')" = "none"

      - name: Setup Flatpak runtimes
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Download internal Shhield binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-shhield-${{ matrix.target }}${{ matrix.variant_suffix }}
          path: backend

      - name: Prepare desktop backend
        env:
          INTERNAL_BINARY: internal-shhield-${{ matrix.target }}${{ matrix.variant_suffix }}
        run: |
          mkdir -p ui/desktop/src/bin
          rm -f ui/desktop/src/bin/shhield
          mv "backend/${INTERNAL_BINARY}" ui/desktop/src/bin/shhield
          chmod +x ui/desktop/src/bin/shhield
          file ui/desktop/src/bin/shhield

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ui/desktop/node_modules
            .hermit/node/cache
          key: linux-pnpm-cache-v1-${{ matrix.electron_arch }}-${{ matrix.variant }}-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            linux-pnpm-cache-v1-${{ matrix.electron_arch }}-${{ matrix.variant }}-${{ runner.os }}-

      - name: Install pnpm dependencies
        run: |
          source ./bin/activate-hermit
          cd ui/desktop
          pnpm install --frozen-lockfile

      - name: Prepare bundled rbt3 build input
        env:
          SHHIELD_RBT3_BUILD_BASE_URL: ${{ vars.SHHIELD_RBT3_BUILD_BASE_URL }}
        run: |
          test -n "${SHHIELD_RBT3_BUILD_BASE_URL}" || {
            echo "Set the repository variable SHHIELD_RBT3_BUILD_BASE_URL to the controlled rbt3 object directory."
            exit 1
          }
          model_dir="${RUNNER_TEMP}/shhield-rbt3"
          mkdir -p "${model_dir}"
          for file in config.json tokenizer.json model.safetensors; do
            curl --fail --location --retry 3 \
              "${SHHIELD_RBT3_BUILD_BASE_URL%/}/${file}" \
              --output "${model_dir}/${file}"
          done
          echo "SHHIELD_RBT3_MODEL_DIR=${model_dir}" >> "${GITHUB_ENV}"

      - name: Build Linux packages
        env:
          ELECTRON_ARCH: ${{ matrix.electron_arch }}
          FLATPAK_ARCH: ${{ matrix.flatpak_arch }}
          SHHIELD_DESKTOP_LINUX_VARIANT: ${{ matrix.variant }}
        run: |
          source ./bin/activate-hermit
          cd ui/desktop
          pnpm run make --platform=linux --arch="${ELECTRON_ARCH}"

          if [ "${SHHIELD_DESKTOP_LINUX_VARIANT}" = "vulkan" ]; then
            for package in \
              "out/make/deb/${ELECTRON_ARCH}/"*.deb \
              "out/make/rpm/${ELECTRON_ARCH}/"*.rpm \
              "out/make/flatpak/${FLATPAK_ARCH}/"*.flatpak; do
              [ -e "${package}" ] || continue
              extension="${package##*.}"
              base="${package%.*}"
              mv "${package}" "${base}-vulkan.${extension}"
            done
          fi

          for package in "out/make/rpm/${ELECTRON_ARCH}/"*.rpm; do
            package_contents="$(rpm -qlp "${package}")"
            if grep -qE '^/usr/lib/\.build-id(/|$)' <<< "${package_contents}"; then
              echo "::error file=${package}::RPM contains build-id links"
              exit 1
            fi
          done

          find out/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.flatpak" \) -exec ls -lh {} \;

      - name: Upload .deb package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 1
          name: Shhield-linux-${{ matrix.electron_arch }}${{ matrix.variant_suffix }}-deb
          path: ui/desktop/out/make/deb/${{ matrix.electron_arch }}/*${{ matrix.variant_suffix }}.deb
          if-no-files-found: error

      - name: Upload .rpm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 1
          name: Shhield-linux-${{ matrix.electron_arch }}${{ matrix.variant_suffix }}-rpm
          path: ui/desktop/out/make/rpm/${{ matrix.electron_arch }}/*${{ matrix.variant_suffix }}.rpm
          if-no-files-found: error

      - name: Upload .flatpak package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 1
          name: Shhield-linux-${{ matrix.electron_arch }}${{ matrix.variant_suffix }}-flatpak
          path: ui/desktop/out/make/flatpak/${{ matrix.flatpak_arch }}/*${{ matrix.variant_suffix }}.flatpak
          if-no-files-found: error
